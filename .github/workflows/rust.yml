name: Rust

on:
  push:
    paths: 
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/.github/workflows/*'
      - '**/src/*'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/.github/workflows/*'
      - '**/src/*'

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ secrets.gh_token }}

jobs:
  cargo_tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Update
      run: |
        rustup update     
    
    - name: rustfmt
      run: |
        rustup component add rustfmt
        cargo fmt --all -- --check

    - name: Build
      run: cargo build 
    
    - name: Run tests
      run: cargo test 

    - name: Create documentation
      run: cargo doc 
      
    - name: binstall
      run: |
        cargo install cargo-binstall
# curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

    - name: Check Semver
      run: |
        cargo binstall --no-confirm cargo-semver-checks
        cargo semver-checks

    - name: audit
      run: |
        cargo binstall --no-confirm cargo-audit
        cargo audit

    - name: cargo deny
      run: |
        cargo binstall --no-confirm cargo-deny
        cargo deny check

    - name: cargo_outdated
      run: |  
        cargo binstall --no-confirm cargo-outdated
        cargo outdated

# Works with nightly only
#    - name: cargo udeps
#      run: |
#        cargo install --git https://github.com/est31/cargo-udeps --locked
#        cargo binstall --no-confirm cargo-udeps
#        cargo udeps

# nono does not compile anymore    
#    - name: ensure_no_std
#      run: |
#        RUSTFLAGS="--cfg procmacro2_semver_exempt" cargo install cargo-nono
#        cargo nono check
        
    - name: cargo pants
      env:
        OSS_INDEX_API_KEY: ${{ secrets.OSS_INDEX_API_KEY }}
      run: |
       cargo binstall --no-confirm cargo-pants
       cargo pants

