name: Rust

on:
  push:
    paths: 
      - '**/Cargo.toml'
      - '**/.github/workflows/*'
      - '**/src/*'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/.github/workflows/*'
      - '**/src/*'

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache cargo packages
      id: cargo-cache
      uses: actions/cache@v3
      with:
        path: |
          ~./cargo
          ./target
        key: rust-${{ github.run_id }}


    - if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' }}
      name: List the cached binaries
      continue-on-error: true
      run: ls ~/.cargo/bin

    - name: Update
      run: |
        rustup default nightly
        rustup update     

    - name: binstall form binary
      id: from_binary
      continue-on-error: true
      run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    
    - name: binstall from source
      if: ${{ steps.from_binary.outcome == 'failure' }}
      run:  cargo install cargo-binstall

  build_and_test:
    needs: install
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache cargo packages
      id: cargo-cache
      uses: actions/cache@v3
      with:
        path: |
          ~./cargo
          ./target
        key: rust-${{ github.run_id }}

    - name: Build
      run: cargo build 
  
    - name: Run tests
      run: cargo test 

    - name: secret scan
      run: |
        cargo binstall --no-confirm fencer
        fencer --project_dir ./

    - name: cargo diet
      run: |
        cargo binstall --no-confirm cargo-diet
        cargo diet --dry-run

    - name: audit
      run: |
        cargo binstall --no-confirm cargo-audit
        cargo audit
   
    - name: cargo deny
      run: |
        cargo binstall --no-confirm cargo-deny
        cargo deny check

    - name: cargo pants
      env:
        OSS_INDEX_API_KEY: ${{ secrets.OSS_INDEX_API_KEY }}
      run: |
       cargo binstall --no-confirm cargo-pants
       cargo pants -v
     
    - name: cargo_outdated
      run: |  
        cargo binstall --no-confirm cargo-outdated
        cargo outdated

    - name: cargo udeps
      run: |
        cargo binstall --no-confirm cargo-udeps
        cargo udeps

    - name: rustfmt
      run: |
        rustup component add rustfmt
        cargo fmt --all --check -v
   
    - name: Check Semver
      run: |
        cargo binstall --no-confirm cargo-semver-checks
        cargo semver-checks check-release -v

  

