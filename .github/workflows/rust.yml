name: Rust

on:
  push:
    paths: 
      - '**/Cargo.toml'
      - '**/.github/workflows/*'
      - '**/src/*'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/.github/workflows/*'
      - '**/src/*'

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache cargo packages
      id: cargo-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/
          ./target/
        key: rust
        restore-keys: rust-${{ github.run_id }}

    - name: Update
      run: |
        rustup default nightly
        rustup update     

    - name: binstall form binary
      id: from_binary
      continue-on-error: true
      run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    
    - name: binstall from source
      if: ${{ steps.from_binary.outcome == 'failure' }}
      run:  cargo install cargo-binstall
    
    - name: create directory
      run: mkdir ~/target/

  build_and_test:
    needs: install
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache cargo packages
      id: cargo-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/
          ./target/
        key: rust

    - name: Build
      run: cargo build 

  
    - name: Run tests
      run: cargo test 
  
  secret_scan:
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
      
      - name: fencer
        run: |
          cargo binstall --no-confirm fencer
          fencer --project_dir ./
  
  check_for_bloat:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
         
      - name: cargo diet
        run: |
          cargo binstall --no-confirm cargo-diet
          cargo diet --dry-run
  
  audit_for_vulnerabilities:
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
      
      - name: audit
        run: |
          cargo binstall --no-confirm cargo-audit
          cargo audit
  
  check_licenses:
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
      
      - name: cargo deny
        run: |
          cargo binstall --no-confirm cargo-deny
          cargo deny check
  
  Sonatype_OSSIndex: 
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
             
      - name: cargo pants
        env: 
          OSS_INDEX_API_KEY: ${{ secrets.OSS_INDEX_API_KEY }}
        run: |
           cargo binstall --no-confirm cargo-pants
           cargo pants -v
  
  Outdated_dependencies:
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
      
      - name: cargo_outdated
        run: |  
          cargo binstall --no-confirm cargo-outdated
          cargo outdated
  
  Unused_dependencies:
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
      
      - name: cargo udeps
        run: |
          cargo binstall --no-confirm cargo-udeps
          cargo udeps

  Comply_with_formating_standard:
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
      
      - name: rustfmt
        run: |
          rustup component add rustfmt
          cargo fmt --all --check -v
   
  Comply_with_versioning_standard:
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
          
      - name: Check Semver
        run: |
          cargo binstall --no-confirm cargo-semver-checks
          cargo semver-checks check-release -v

  Spellcheck:
    needs: install
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache cargo packages
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ./target/
          key: rust
      
      - name: cargo spellcheck
        run: | 
          cargo add cargo-spellcheck
          cargo spellchek check
         

